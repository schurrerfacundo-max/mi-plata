<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Plata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400;1,9..144,800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f1ea;
    --paper: #fffdf8;
    --ink: #14110d;
    --muted: #7a7164;
    --line: rgba(20,17,13,0.12);
    --income: #2d6a4f;
    --fijo: #c44536;
    --variable: #d68c45;
    --ahorro: #4a7c8c;
    --inversion: #6b4c93;
    --warn: #b8331f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Fraunces', serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; padding: 16px 14px 100px;
  }
  .container { max-width: 720px; margin: 0 auto; }
  header { border-bottom: 2px solid var(--ink); padding-bottom: 14px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .logo { font-size: 26px; font-weight: 800; letter-spacing: -0.04em; font-style: italic; }
  .logo::after { content: '·'; color: var(--fijo); margin: 0 4px; }
  .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .user-email { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.05em; color: var(--muted); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .logout-btn { background: none; border: 1px solid var(--ink); padding: 5px 10px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; }
  .logout-btn:hover { background: var(--ink); color: var(--bg); }
  .sync-indicator { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .sync-dot.synced { background: var(--income); }
  .sync-dot.syncing { background: var(--variable); animation: pulse 1s infinite; }
  .sync-dot.error { background: var(--warn); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .tabs { display: flex; gap: 4px; margin-bottom: 14px; background: var(--paper); border: 1px solid var(--ink); padding: 3px; }
  .tab { flex: 1; padding: 10px 4px; background: none; border: none; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; color: var(--muted); transition: all 0.2s; }
  .tab.active { background: var(--ink); color: var(--bg); }
  .month-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 18px; }
  .month-btn { background: var(--paper); border: 1px solid var(--ink); width: 36px; height: 36px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
  .month-btn:hover { background: var(--ink); color: var(--bg); }
  .month-current { font-size: 22px; font-weight: 800; font-style: italic; letter-spacing: -0.02em; min-width: 180px; text-align: center; }
  .summary { background: var(--paper); border: 2px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 18px; margin-bottom: 18px; }
  .summary-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .balance-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 16px; }
  .balance { font-size: 38px; font-weight: 800; font-style: italic; letter-spacing: -0.04em; line-height: 1; }
  .balance.negative { color: var(--warn); }
  .balance-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; }
  .stat.income .stat-value { color: var(--income); }
  .stat.fijo .stat-value { color: var(--fijo); }
  .stat.variable .stat-value { color: var(--variable); }
  .stat.ahorro .stat-value { color: var(--ahorro); }
  .stat.inversion .stat-value { color: var(--inversion); }
  .income-card { background: var(--paper); border: 1px solid var(--ink); padding: 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }
  .income-card .label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); flex: 1; }
  .income-input { border: 1px solid var(--ink); background: var(--bg); padding: 8px 10px; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; width: 140px; text-align: right; color: var(--income); }
  .income-input:focus { outline: 2px solid var(--income); outline-offset: -1px; }
  .section { margin-bottom: 18px; }
  .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 2px; }
  .section-title { font-size: 20px; font-weight: 800; font-style: italic; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
  .section-dot { width: 10px; height: 10px; border-radius: 50%; }
  .section-total { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; }
  .cat-list { background: var(--paper); border: 1px solid var(--ink); }
  .cat-row { display: flex; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); gap: 10px; }
  .cat-row:last-child { border-bottom: none; }
  .cat-name { flex: 1; font-size: 16px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-amount-input { border: 1px solid var(--line); background: var(--bg); padding: 6px 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; width: 110px; text-align: right; border-radius: 0; }
  .cat-amount-input:focus { outline: 2px solid var(--ink); outline-offset: -1px; }
  .cat-delete { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 4px 6px; line-height: 1; }
  .cat-delete:hover { color: var(--warn); }
  .add-cat { width: 100%; padding: 12px; background: none; border: 1px dashed var(--ink); font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; margin-top: 6px; color: var(--muted); }
  .add-cat:hover { background: var(--ink); color: var(--bg); border-style: solid; }
  .chart-card { background: var(--paper); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 18px; margin-bottom: 18px; }
  .chart-title { font-size: 20px; font-weight: 800; font-style: italic; letter-spacing: -0.02em; margin-bottom: 14px; }
  .donut-wrap { display: flex; justify-content: center; margin-bottom: 18px; position: relative; }
  .donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
  .donut-center-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
  .donut-center-value { font-size: 22px; font-weight: 800; font-style: italic; letter-spacing: -0.03em; }
  .legend { display: flex; flex-direction: column; gap: 8px; }
  .legend-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); }
  .legend-dot { width: 14px; height: 14px; flex-shrink: 0; }
  .legend-name { font-size: 14px; font-weight: 500; flex: 1; }
  .legend-pct { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; min-width: 50px; text-align: right; }
  .legend-amt { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); min-width: 90px; text-align: right; }
  .year-select { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
  .year-select select { flex: 1; padding: 10px; border: 1px solid var(--ink); background: var(--paper); font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; -webkit-appearance: none; appearance: none; padding-right: 36px; }
  .annual-card { background: var(--paper); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 16px; margin-bottom: 14px; }
  .annual-card-title { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .annual-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .annual-row:last-child { border-bottom: none; }
  .annual-dot { width: 12px; height: 12px; flex-shrink: 0; }
  .annual-name { flex: 1; font-size: 14px; font-weight: 500; }
  .annual-bar-wrap { flex: 1.5; height: 14px; background: rgba(20,17,13,0.06); position: relative; }
  .annual-bar { height: 100%; transition: width 0.5s; }
  .annual-val { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; min-width: 80px; text-align: right; }
  .months-chart { display: flex; align-items: flex-end; gap: 4px; height: 140px; padding: 10px 0 6px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  .month-bar-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 1px; min-width: 0; position: relative; }
  .month-bar-col:hover .month-bar-tooltip { display: block; }
  .month-bar-tooltip { display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 8px; white-space: nowrap; z-index: 10; margin-bottom: 4px; }
  .month-bar-segment { width: 100%; min-height: 0; }
  .months-labels { display: flex; gap: 4px; }
  .month-label { flex: 1; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-style: italic; background: var(--paper); border: 1px dashed var(--ink); }
  .empty::before { content: '✦'; display: block; font-size: 28px; margin-bottom: 6px; font-style: normal; color: var(--fijo); }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--ink); color: var(--bg); padding: 12px 20px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; transition: transform 0.3s; z-index: 200; box-shadow: 4px 4px 0 rgba(0,0,0,0.2); }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--warn); }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(20,17,13,0.55); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
  .modal-backdrop.show { display: flex; }
  .modal { background: var(--paper); border: 2px solid var(--ink); padding: 22px; max-width: 360px; width: 100%; box-shadow: 8px 8px 0 var(--ink); }
  .modal h3 { font-size: 22px; font-style: italic; margin-bottom: 14px; letter-spacing: -0.02em; }
  .modal input { width: 100%; padding: 12px; border: 1px solid var(--ink); background: var(--bg); font-family: 'Fraunces', serif; font-size: 15px; margin-bottom: 6px; }
  .modal input:focus { outline: 2px solid var(--fijo); outline-offset: -1px; }
  .modal-buttons { display: flex; gap: 8px; margin-top: 14px; }
  .modal-buttons button { flex: 1; padding: 11px; border: 1px solid var(--ink); font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; background: var(--bg); }
  .modal-buttons button.primary { background: var(--ink); color: var(--bg); }

  /* INITIAL LOADING / ERROR SCREEN */
  .init-screen { max-width: 480px; margin: 60px auto 0; padding: 0 20px; text-align: center; }
  .init-logo { font-size: 42px; font-weight: 800; font-style: italic; letter-spacing: -0.04em; margin-bottom: 12px; }
  .init-logo span { color: var(--fijo); }
  .init-status { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 24px; }
  .init-spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--line); border-top-color: var(--fijo); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .init-error { background: var(--paper); border: 2px solid var(--warn); padding: 18px; text-align: left; margin-top: 16px; }
  .init-error h4 { color: var(--warn); font-size: 16px; margin-bottom: 8px; font-style: italic; }
  .init-error p { font-size: 14px; line-height: 1.5; margin-bottom: 8px; }
  .init-error code { font-family: 'JetBrains Mono', monospace; font-size: 12px; background: var(--bg); padding: 2px 6px; border: 1px solid var(--line); display: inline-block; max-width: 100%; overflow-wrap: break-word; word-break: break-all; }
  .init-error .check { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .init-retry { margin-top: 16px; padding: 10px 20px; background: var(--ink); color: var(--bg); border: none; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; }

  /* AUTH SCREEN */
  .auth-screen { max-width: 380px; margin: 60px auto 0; padding: 0 20px; }
  .auth-logo { text-align: center; font-size: 42px; font-weight: 800; font-style: italic; letter-spacing: -0.04em; margin-bottom: 8px; }
  .auth-logo span { color: var(--fijo); }
  .auth-tagline { text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 32px; }
  .auth-card { background: var(--paper); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 24px; }
  .auth-tabs { display: flex; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .auth-tab { flex: 1; padding: 10px; background: none; border: none; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .auth-tab.active { color: var(--ink); border-bottom-color: var(--fijo); }
  .auth-field { margin-bottom: 12px; }
  .auth-field label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .auth-field input { width: 100%; padding: 12px; border: 1px solid var(--ink); background: var(--bg); font-family: 'Fraunces', serif; font-size: 15px; }
  .auth-field input:focus { outline: 2px solid var(--fijo); outline-offset: -1px; }
  .auth-submit { width: 100%; padding: 14px; background: var(--ink); color: var(--bg); border: none; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; margin-top: 6px; }
  .auth-submit:hover { background: var(--fijo); }
  .auth-submit:disabled { background: var(--muted); cursor: not-allowed; }
  .auth-error { background: rgba(184,51,31,0.08); border: 1px solid var(--warn); color: var(--warn); padding: 10px; font-size: 13px; margin-bottom: 12px; }

  @media (max-width: 380px) {
    .balance { font-size: 32px; }
    .month-current { font-size: 18px; min-width: 140px; }
    .cat-amount-input { width: 95px; }
    .income-input { width: 120px; }
    .user-email { max-width: 100px; }
  }
</style>
</head>
<body>

<!-- INITIAL LOADING / ERROR -->
<div id="initScreen">
  <div class="init-screen">
    <div class="init-logo">mi<i>plata</i><span>·</span></div>
    <div id="initContent">
      <div class="init-spinner"></div>
      <div class="init-status" id="initStatus">conectando...</div>
    </div>
  </div>
</div>

<!-- AUTH SCREEN -->
<div id="authScreen" style="display:none">
  <div class="auth-screen">
    <div class="auth-logo">mi<i>plata</i><span>·</span></div>
    <div class="auth-tagline">tus finanzas, organizadas</div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">Entrar</button>
        <button class="auth-tab" id="tabSignup" onclick="switchAuthTab('signup')">Crear cuenta</button>
      </div>
      <div id="authError" class="auth-error" style="display:none"></div>
      <form id="authForm" onsubmit="handleAuth(event)">
        <div class="auth-field">
          <label for="authEmail">Email</label>
          <input type="email" id="authEmail" required autocomplete="email">
        </div>
        <div class="auth-field">
          <label for="authPassword">Contraseña</label>
          <input type="password" id="authPassword" required minlength="6" autocomplete="current-password">
        </div>
        <button type="submit" class="auth-submit" id="authSubmit">Entrar</button>
      </form>
    </div>
  </div>
</div>

<!-- APP -->
<div id="appScreen" style="display:none">
  <div class="container">
    <header>
      <div class="logo">mi<i>plata</i></div>
      <div class="header-right">
        <div class="sync-indicator">
          <span class="sync-dot synced" id="syncDot"></span>
          <span id="syncText">sync</span>
        </div>
        <div class="user-email" id="userEmail"></div>
        <button class="logout-btn" onclick="logout()">salir</button>
      </div>
    </header>
    <div class="tabs">
      <button class="tab active" data-tab="month" onclick="switchTab('month')">mes</button>
      <button class="tab" data-tab="chart" onclick="switchTab('chart')">gráfico</button>
      <button class="tab" data-tab="year" onclick="switchTab('year')">año</button>
    </div>
    <div id="app"></div>
  </div>
</div>

<div class="modal-backdrop" id="addCatModal">
  <div class="modal">
    <h3 id="addCatTitle">Nueva categoría</h3>
    <input type="text" id="newCatName" placeholder="Nombre" maxlength="40">
    <div class="modal-buttons">
      <button onclick="closeAddCat()">cancelar</button>
      <button class="primary" onclick="confirmAddCat()">agregar</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="renameModal">
  <div class="modal">
    <h3>Renombrar</h3>
    <input type="text" id="renameInput" maxlength="40">
    <div class="modal-buttons">
      <button onclick="closeRename()">cancelar</button>
      <button class="primary" onclick="confirmRename()">guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Supabase SDK with onload/onerror handlers -->
<script>
  window.__supabaseLoaded = false;
  window.__supabaseFailed = false;
</script>
<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  onload="window.__supabaseLoaded = true"
  onerror="window.__supabaseFailed = true"
></script>

<script>
/* ============ CONFIG ============ */
const SUPABASE_URL = 'https://upxdcxcimogmhlnpusla.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Uv1vgWRSqi3CRCkGK0_nyQ_qoL_JX5K';

let db = null;

/* ============ INIT WITH ERROR DISPLAY ============ */

function setInitStatus(text) {
  const el = document.getElementById('initStatus');
  if (el) el.textContent = text;
}

function showInitError(title, message, technical) {
  const content = document.getElementById('initContent');
  content.innerHTML = `
    <div class="init-error">
      <h4>${title}</h4>
      <p>${message}</p>
      ${technical ? `<p class="check">Detalle técnico:<br><code>${escapeHtml(technical)}</code></p>` : ''}
    </div>
    <button class="init-retry" onclick="location.reload()">Reintentar</button>
  `;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function initialize() {
  // 1. Esperar a que cargue el SDK de Supabase (con timeout)
  setInitStatus('cargando librerías...');

  const sdkReady = await waitForSdk(10000);
  if (!sdkReady) {
    if (window.__supabaseFailed) {
      showInitError(
        'No se pudo cargar Supabase',
        'El navegador no pudo descargar la librería de Supabase desde internet. Verificá que tengas conexión y que ningún bloqueador esté impidiéndolo.',
        'CDN bloqueada o sin internet'
      );
    } else {
      showInitError(
        'Tiempo agotado',
        'La librería de Supabase tardó demasiado en cargar. Probá refrescar la página o revisar tu conexión.',
        'Timeout (10s) esperando @supabase/supabase-js'
      );
    }
    return;
  }

  // 2. Crear cliente de Supabase
  setInitStatus('inicializando...');
  try {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } catch (err) {
    showInitError(
      'Error al inicializar',
      'No se pudo crear el cliente de Supabase. Verificá que la URL y la clave en el código sean correctas.',
      err.message
    );
    return;
  }

  // 3. Verificar sesión actual
  setInitStatus('verificando sesión...');
  try {
    const sessionPromise = db.auth.getSession();
    const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout 8s')), 8000));
    const { data: { session } } = await Promise.race([sessionPromise, timeoutPromise]);

    if (session) {
      state.user = session.user;
      await showApp();
    } else {
      showAuth();
    }
  } catch (err) {
    showInitError(
      'No se pudo conectar con Supabase',
      'La app no logró conectarse al servidor. Posibles causas: el proyecto de Supabase está pausado (los proyectos free se pausan tras 7 días sin uso), la URL del proyecto está mal escrita, o tu conexión a internet falla.',
      err.message
    );
  }
}

function waitForSdk(timeout) {
  return new Promise((resolve) => {
    const start = Date.now();
    const check = () => {
      if (window.__supabaseLoaded && window.supabase) {
        resolve(true);
        return;
      }
      if (window.__supabaseFailed) {
        resolve(false);
        return;
      }
      if (Date.now() - start > timeout) {
        resolve(false);
        return;
      }
      setTimeout(check, 100);
    };
    check();
  });
}

/* ============ STATE ============ */

const SECTIONS = [
  { key: 'fijo',      title: 'Gastos Fijos',     color: 'var(--fijo)',      colorHex: '#c44536' },
  { key: 'variable',  title: 'Gastos Variables', color: 'var(--variable)',  colorHex: '#d68c45' },
  { key: 'ahorro',    title: 'Ahorro',           color: 'var(--ahorro)',    colorHex: '#4a7c8c' },
  { key: 'inversion', title: 'Inversión',        color: 'var(--inversion)', colorHex: '#6b4c93' }
];

const DEFAULT_CATEGORIES = {
  fijo: [{ name: 'Alquiler' }, { name: 'Servicios' }, { name: 'Internet' }],
  variable: [{ name: 'Comida' }, { name: 'Transporte' }, { name: 'Salidas' }],
  ahorro: [{ name: 'Fondo emergencia' }],
  inversion: [{ name: 'Plazo fijo' }]
};

const state = {
  user: null, authMode: 'login', view: 'month',
  selectedMonth: null, selectedYear: null,
  categories: { fijo: [], variable: [], ahorro: [], inversion: [] },
  monthly: {}, pending: { section: null, catId: null },
  saveTimeouts: {}
};

const monthNames = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const monthShort = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

const fmt = (n) => '$' + new Intl.NumberFormat('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(Math.round(n || 0));
const fmtPct = (n) => (n || 0).toFixed(1) + '%';
const monthKey = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const monthLabel = (key) => { const [y, m] = key.split('-'); return `${monthNames[parseInt(m)-1]} ${y}`; };
function ensureMonth(key) { if (!state.monthly[key]) state.monthly[key] = { income: 0, amounts: {} }; return state.monthly[key]; }
function sectionTotal(mk, section) { const m = state.monthly[mk]; if (!m) return 0; return state.categories[section].reduce((s, c) => s + (m.amounts[c.id] || 0), 0); }
function monthTotalSpent(mk) { return SECTIONS.reduce((s, sec) => s + sectionTotal(mk, sec.key), 0); }

function setSync(status) {
  const dot = document.getElementById('syncDot');
  const text = document.getElementById('syncText');
  if (!dot) return;
  dot.className = 'sync-dot ' + status;
  text.textContent = status === 'syncing' ? 'guardando' : status === 'error' ? 'error' : 'sync';
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

/* ============ SCREENS ============ */

function showAuth() {
  document.getElementById('initScreen').style.display = 'none';
  document.getElementById('authScreen').style.display = 'block';
  document.getElementById('appScreen').style.display = 'none';
}

async function showApp() {
  document.getElementById('initScreen').style.display = 'none';
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  document.getElementById('userEmail').textContent = state.user.email;
  const now = new Date();
  state.selectedMonth = monthKey(now);
  state.selectedYear = now.getFullYear();
  ensureMonth(state.selectedMonth);
  await loadAll();
}

function switchAuthTab(mode) {
  state.authMode = mode;
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabSignup').classList.toggle('active', mode === 'signup');
  document.getElementById('authSubmit').textContent = mode === 'login' ? 'Entrar' : 'Crear cuenta';
  document.getElementById('authError').style.display = 'none';
}

async function handleAuth(event) {
  event.preventDefault();
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errorBox = document.getElementById('authError');
  const submitBtn = document.getElementById('authSubmit');
  errorBox.style.display = 'none';
  submitBtn.disabled = true;
  submitBtn.textContent = 'esperá...';

  try {
    let result;
    if (state.authMode === 'login') {
      result = await db.auth.signInWithPassword({ email, password });
    } else {
      result = await db.auth.signUp({ email, password });
    }

    if (result.error) {
      let msg = result.error.message;
      if (msg.includes('Invalid login')) msg = 'Email o contraseña incorrectos';
      else if (msg.includes('already registered')) msg = 'Este email ya está registrado, probá iniciar sesión';
      else if (msg.includes('Password should')) msg = 'La contraseña debe tener al menos 6 caracteres';
      else if (msg.includes('Email not confirmed')) msg = 'Tu cuenta necesita confirmación por mail. Desactivá "Confirm email" en Supabase → Auth → Sign In/Up → Email';
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    } else if (result.data.user && result.data.session) {
      state.user = result.data.user;
      if (state.authMode === 'signup') await createDefaultCategories();
      await showApp();
    } else if (result.data.user && !result.data.session) {
      // Signup successful but no session = email confirmation required
      errorBox.textContent = 'Tu cuenta fue creada pero necesita confirmación. Desactivá "Confirm email" en Supabase: Auth → Sign In/Up → Email → Confirm email OFF';
      errorBox.style.display = 'block';
    }
  } catch (err) {
    errorBox.textContent = 'Error: ' + err.message;
    errorBox.style.display = 'block';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = state.authMode === 'login' ? 'Entrar' : 'Crear cuenta';
  }
}

async function logout() {
  if (!confirm('¿Cerrar sesión?')) return;
  await db.auth.signOut();
  state.user = null;
  state.categories = { fijo: [], variable: [], ahorro: [], inversion: [] };
  state.monthly = {};
  showAuth();
}

async function createDefaultCategories() {
  const rows = [];
  for (const sec of SECTIONS) {
    for (const cat of DEFAULT_CATEGORIES[sec.key]) {
      rows.push({ user_id: state.user.id, section: sec.key, name: cat.name });
    }
  }
  const { error } = await db.from('categories').insert(rows);
  if (error) console.error('Error creating defaults:', error);
}

/* ============ DATA ============ */

async function loadAll() {
  setSync('syncing');
  try {
    const { data: cats, error: catErr } = await supabase
      .from('categories').select('*').order('created_at', { ascending: true });
    if (catErr) {
      if (catErr.message.includes('does not exist') || catErr.code === '42P01') {
        showToast('Faltan las tablas en Supabase. Ejecutá el SQL.', true);
        setSync('error');
        return;
      }
      throw catErr;
    }

    state.categories = { fijo: [], variable: [], ahorro: [], inversion: [] };
    if (cats && cats.length > 0) {
      cats.forEach(c => {
        if (state.categories[c.section]) state.categories[c.section].push({ id: c.id, name: c.name });
      });
    } else {
      await createDefaultCategories();
      const { data: cats2 } = await db.from('categories').select('*').order('created_at', { ascending: true });
      cats2?.forEach(c => {
        if (state.categories[c.section]) state.categories[c.section].push({ id: c.id, name: c.name });
      });
    }

    const { data: months, error: monthErr } = await db.from('monthly_data').select('*');
    if (monthErr) throw monthErr;

    state.monthly = {};
    months?.forEach(m => {
      state.monthly[m.month_key] = {
        income: parseFloat(m.income) || 0,
        amounts: m.amounts || {}
      };
    });

    ensureMonth(state.selectedMonth);
    setSync('synced');
    render();
  } catch (err) {
    console.error(err);
    setSync('error');
    showToast('Error al cargar: ' + err.message, true);
  }
}

async function saveMonthData(mk) {
  setSync('syncing');
  try {
    const m = state.monthly[mk];
    const { error } = await db.from('monthly_data').upsert({
      user_id: state.user.id, month_key: mk,
      income: m.income || 0, amounts: m.amounts || {},
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id,month_key' });
    if (error) throw error;
    setSync('synced');
  } catch (err) {
    console.error(err);
    setSync('error');
    showToast('Error al guardar', true);
  }
}

function scheduleSave(mk) {
  if (state.saveTimeouts[mk]) clearTimeout(state.saveTimeouts[mk]);
  state.saveTimeouts[mk] = setTimeout(() => {
    saveMonthData(mk);
    delete state.saveTimeouts[mk];
  }, 500);
}

/* ============ RENDER ============ */

function switchTab(tab) {
  state.view = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  render();
}

function render() {
  const app = document.getElementById('app');
  if (state.view === 'month') app.innerHTML = renderMonth();
  else if (state.view === 'chart') app.innerHTML = renderChart();
  else if (state.view === 'year') app.innerHTML = renderYear();
}

function renderMonth() {
  const mk = state.selectedMonth;
  const m = ensureMonth(mk);
  const totals = {};
  SECTIONS.forEach(s => { totals[s.key] = sectionTotal(mk, s.key); });
  const totalOut = totals.fijo + totals.variable + totals.ahorro + totals.inversion;
  const balance = m.income - totalOut;
  return `
    <div class="month-nav">
      <button class="month-btn" onclick="changeMonth(-1)">‹</button>
      <div class="month-current">${monthLabel(mk)}</div>
      <button class="month-btn" onclick="changeMonth(1)">›</button>
    </div>
    <div class="summary">
      <div class="summary-label">balance del mes</div>
      <div class="balance-row">
        <div class="balance ${balance < 0 ? 'negative' : ''}">${balance < 0 ? '−' : ''}${fmt(Math.abs(balance))}</div>
        <div class="balance-sub">de ${fmt(m.income)}</div>
      </div>
      <div class="stats-grid">
        <div class="stat income"><div class="stat-label">ingresos</div><div class="stat-value">${fmt(m.income)}</div></div>
        <div class="stat fijo"><div class="stat-label">fijos</div><div class="stat-value">${fmt(totals.fijo)}</div></div>
        <div class="stat variable"><div class="stat-label">variables</div><div class="stat-value">${fmt(totals.variable)}</div></div>
        <div class="stat ahorro"><div class="stat-label">ahorro</div><div class="stat-value">${fmt(totals.ahorro)}</div></div>
        <div class="stat inversion" style="grid-column: 1 / -1;"><div class="stat-label">inversión</div><div class="stat-value">${fmt(totals.inversion)}</div></div>
      </div>
    </div>
    <div class="income-card">
      <div class="label">ingreso del mes</div>
      <input type="number" class="income-input" value="${m.income || ''}" placeholder="0" step="any" min="0" onchange="updateIncome(this.value)" onfocus="this.select()">
    </div>
    ${SECTIONS.map(sec => renderSection(sec, mk)).join('')}
  `;
}

function renderSection(sec, mk) {
  const m = state.monthly[mk];
  const cats = state.categories[sec.key];
  const total = sectionTotal(mk, sec.key);
  return `
    <div class="section">
      <div class="section-head">
        <div class="section-title"><span class="section-dot" style="background:${sec.color}"></span>${sec.title}</div>
        <div class="section-total" style="color:${sec.color}">${fmt(total)}</div>
      </div>
      ${cats.length === 0 ? `<div class="empty" style="padding:24px;font-size:14px">sin categorías</div>` : `
        <div class="cat-list">
          ${cats.map(c => `
            <div class="cat-row">
              <div class="cat-name" ondblclick="openRename('${sec.key}','${c.id}')">${escapeHtml(c.name)}</div>
              <input type="number" class="cat-amount-input" value="${m.amounts[c.id] || ''}" placeholder="0" step="any" min="0" onchange="updateAmount('${c.id}', this.value)" onfocus="this.select()">
              <button class="cat-delete" onclick="deleteCategory('${sec.key}','${c.id}')" title="eliminar">×</button>
            </div>
          `).join('')}
        </div>
      `}
      <button class="add-cat" onclick="openAddCat('${sec.key}')">+ agregar categoría</button>
    </div>
  `;
}

function renderChart() {
  const mk = state.selectedMonth;
  const m = ensureMonth(mk);
  const income = m.income || 0;
  const totals = {};
  SECTIONS.forEach(s => { totals[s.key] = sectionTotal(mk, s.key); });
  const totalOut = totals.fijo + totals.variable + totals.ahorro + totals.inversion;
  const segments = SECTIONS.map(s => ({ name: s.title, color: s.colorHex, value: totals[s.key], pct: income > 0 ? (totals[s.key] / income) * 100 : 0 })).filter(seg => seg.value > 0);
  const libre = income - totalOut;
  if (libre > 0 && income > 0) segments.push({ name: 'Libre', color: '#bdb5a6', value: libre, pct: (libre / income) * 100 });
  return `
    <div class="month-nav">
      <button class="month-btn" onclick="changeMonth(-1)">‹</button>
      <div class="month-current">${monthLabel(mk)}</div>
      <button class="month-btn" onclick="changeMonth(1)">›</button>
    </div>
    <div class="chart-card">
      <div class="chart-title">% del ingreso</div>
      ${income === 0 ? `<div class="empty" style="padding:30px">ingresá tu sueldo en la pestaña "mes" para ver el gráfico</div>` :
        segments.length === 0 ? `<div class="empty" style="padding:30px">aún no cargaste gastos este mes</div>` : `
        <div class="donut-wrap">
          ${renderDonut(segments)}
          <div class="donut-center">
            <div class="donut-center-label">gastado</div>
            <div class="donut-center-value">${fmtPct(income > 0 ? (totalOut/income)*100 : 0)}</div>
          </div>
        </div>
        <div class="legend">
          ${segments.map(seg => `
            <div class="legend-row">
              <div class="legend-dot" style="background:${seg.color}"></div>
              <div class="legend-name">${seg.name}</div>
              <div class="legend-pct">${fmtPct(seg.pct)}</div>
              <div class="legend-amt">${fmt(seg.value)}</div>
            </div>
          `).join('')}
        </div>
      `}
    </div>
    ${income > 0 && totalOut > 0 ? renderCategoryBreakdown(mk) : ''}
  `;
}

function renderCategoryBreakdown(mk) {
  const m = state.monthly[mk];
  const allCats = [];
  SECTIONS.forEach(sec => {
    state.categories[sec.key].forEach(c => {
      const v = m.amounts[c.id] || 0;
      if (v > 0) allCats.push({ name: c.name, value: v, color: sec.colorHex, section: sec.title });
    });
  });
  allCats.sort((a, b) => b.value - a.value);
  if (allCats.length === 0) return '';
  const max = allCats[0].value;
  return `
    <div class="chart-card">
      <div class="chart-title">Detalle por categoría</div>
      ${allCats.map(c => `
        <div class="annual-row">
          <div class="annual-dot" style="background:${c.color}"></div>
          <div class="annual-name">${escapeHtml(c.name)}<div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase">${c.section}</div></div>
          <div class="annual-bar-wrap"><div class="annual-bar" style="width:${(c.value/max)*100}%;background:${c.color}"></div></div>
          <div class="annual-val">${fmt(c.value)}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderDonut(segments) {
  if (segments.length === 0) return '';
  const size = 200, r = 75, cx = size/2, cy = size/2, stroke = 30;
  const sum = segments.reduce((s, x) => s + x.value, 0);
  const circ = 2 * Math.PI * r;
  let offset = 0;
  const circles = segments.map(seg => {
    const len = (seg.value / sum) * circ;
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${stroke}" stroke-dasharray="${len} ${circ - len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
    offset += len;
    return el;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(20,17,13,0.06)" stroke-width="${stroke}"></circle>
    ${circles}
  </svg>`;
}

function renderYear() {
  const year = state.selectedYear;
  const yearMonths = [];
  for (let i = 0; i < 12; i++) yearMonths.push(`${year}-${String(i+1).padStart(2,'0')}`);
  const monthsWithData = yearMonths.filter(mk => {
    const m = state.monthly[mk];
    if (!m) return false;
    return m.income > 0 || monthTotalSpent(mk) > 0;
  });
  const sectionAvgs = {};
  SECTIONS.forEach(s => {
    const vals = monthsWithData.map(mk => sectionTotal(mk, s.key));
    sectionAvgs[s.key] = monthsWithData.length > 0 ? vals.reduce((a,b) => a+b, 0) / monthsWithData.length : 0;
  });
  const incomeAvg = monthsWithData.length > 0 ? monthsWithData.reduce((s, mk) => s + (state.monthly[mk].income || 0), 0) / monthsWithData.length : 0;
  const totalAvg = SECTIONS.reduce((s, sec) => s + sectionAvgs[sec.key], 0);
  const maxSecAvg = Math.max(...Object.values(sectionAvgs), 1);
  const annualIncome = monthsWithData.reduce((s, mk) => s + (state.monthly[mk].income || 0), 0);
  const annualSpent = monthsWithData.reduce((s, mk) => s + monthTotalSpent(mk), 0);
  const catAvgs = [];
  SECTIONS.forEach(sec => {
    state.categories[sec.key].forEach(c => {
      const vals = monthsWithData.map(mk => (state.monthly[mk]?.amounts[c.id] || 0));
      const avg = monthsWithData.length > 0 ? vals.reduce((a,b) => a+b, 0) / monthsWithData.length : 0;
      if (avg > 0) catAvgs.push({ name: c.name, avg, color: sec.colorHex, section: sec.title });
    });
  });
  catAvgs.sort((a,b) => b.avg - a.avg);
  const maxCatAvg = catAvgs[0]?.avg || 1;
  const allYears = new Set([new Date().getFullYear()]);
  Object.keys(state.monthly).forEach(mk => allYears.add(parseInt(mk.split('-')[0])));
  const years = [...allYears].sort((a,b) => b - a);
  const maxMonthValue = Math.max(...yearMonths.map(mk => {
    const m = state.monthly[mk];
    if (!m) return 0;
    return Math.max(m.income || 0, monthTotalSpent(mk));
  }), 1);
  return `
    <div class="year-select">
      <select onchange="selectYear(this.value)">
        ${years.map(y => `<option value="${y}" ${y === year ? 'selected' : ''}>${y}</option>`).join('')}
      </select>
    </div>
    <div class="summary">
      <div class="summary-label">resumen ${year}</div>
      <div class="balance-row">
        <div class="balance ${annualIncome - annualSpent < 0 ? 'negative' : ''}">${annualIncome - annualSpent < 0 ? '−' : ''}${fmt(Math.abs(annualIncome - annualSpent))}</div>
        <div class="balance-sub">${monthsWithData.length} ${monthsWithData.length === 1 ? 'mes' : 'meses'} con datos</div>
      </div>
      <div class="stats-grid">
        <div class="stat income"><div class="stat-label">total ingresos</div><div class="stat-value">${fmt(annualIncome)}</div></div>
        <div class="stat fijo"><div class="stat-label">total gastado</div><div class="stat-value">${fmt(annualSpent)}</div></div>
        <div class="stat income"><div class="stat-label">prom. ingreso</div><div class="stat-value">${fmt(incomeAvg)}</div></div>
        <div class="stat variable"><div class="stat-label">prom. gasto</div><div class="stat-value">${fmt(totalAvg)}</div></div>
      </div>
    </div>
    <div class="annual-card">
      <div class="annual-card-title">Gastos por mes</div>
      <div class="months-chart">
        ${yearMonths.map((mk, i) => {
          const m = state.monthly[mk];
          const hasData = m && (m.income > 0 || monthTotalSpent(mk) > 0);
          if (!hasData) return `<div class="month-bar-col"></div>`;
          const segments = SECTIONS.map(sec => ({ color: sec.colorHex, value: sectionTotal(mk, sec.key) })).filter(s => s.value > 0);
          const tot = monthTotalSpent(mk);
          return `
            <div class="month-bar-col">
              <div class="month-bar-tooltip">${monthShort[i]}: ${fmt(tot)}</div>
              ${segments.map(s => `<div class="month-bar-segment" style="height:${(s.value/maxMonthValue)*100}%;background:${s.color}"></div>`).join('')}
            </div>
          `;
        }).join('')}
      </div>
      <div class="months-labels">${monthShort.map(n => `<div class="month-label">${n}</div>`).join('')}</div>
    </div>
    <div class="annual-card">
      <div class="annual-card-title">Promedio mensual por sección</div>
      ${SECTIONS.map(sec => `
        <div class="annual-row">
          <div class="annual-dot" style="background:${sec.colorHex}"></div>
          <div class="annual-name">${sec.title}</div>
          <div class="annual-bar-wrap"><div class="annual-bar" style="width:${(sectionAvgs[sec.key]/maxSecAvg)*100}%;background:${sec.colorHex}"></div></div>
          <div class="annual-val">${fmt(sectionAvgs[sec.key])}</div>
        </div>
      `).join('')}
    </div>
    ${catAvgs.length > 0 ? `
      <div class="annual-card">
        <div class="annual-card-title">Promedio mensual por categoría</div>
        ${catAvgs.map(c => `
          <div class="annual-row">
            <div class="annual-dot" style="background:${c.color}"></div>
            <div class="annual-name">${escapeHtml(c.name)}<div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase">${c.section}</div></div>
            <div class="annual-bar-wrap"><div class="annual-bar" style="width:${(c.avg/maxCatAvg)*100}%;background:${c.color}"></div></div>
            <div class="annual-val">${fmt(c.avg)}</div>
          </div>
        `).join('')}
      </div>
    ` : ''}
  `;
}

/* ============ ACTIONS ============ */

function changeMonth(delta) {
  const [y, m] = state.selectedMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  state.selectedMonth = monthKey(d);
  ensureMonth(state.selectedMonth);
  render();
}

function selectYear(y) { state.selectedYear = parseInt(y); render(); }

function updateIncome(val) {
  const v = parseFloat(val) || 0;
  const m = ensureMonth(state.selectedMonth);
  m.income = v;
  scheduleSave(state.selectedMonth);
  render();
}

function updateAmount(catId, val) {
  const v = parseFloat(val) || 0;
  const m = ensureMonth(state.selectedMonth);
  if (v === 0) delete m.amounts[catId];
  else m.amounts[catId] = v;
  scheduleSave(state.selectedMonth);
  render();
}

function openAddCat(section) {
  state.pending.section = section;
  document.getElementById('newCatName').value = '';
  document.getElementById('addCatTitle').textContent = 'Nueva en ' + SECTIONS.find(s => s.key === section).title;
  document.getElementById('addCatModal').classList.add('show');
  setTimeout(() => document.getElementById('newCatName').focus(), 50);
}

function closeAddCat() { document.getElementById('addCatModal').classList.remove('show'); }

async function confirmAddCat() {
  const name = document.getElementById('newCatName').value.trim();
  if (!name) return;
  setSync('syncing');
  try {
    const { data, error } = await db.from('categories')
      .insert({ user_id: state.user.id, section: state.pending.section, name })
      .select().single();
    if (error) throw error;
    state.categories[state.pending.section].push({ id: data.id, name: data.name });
    setSync('synced');
    closeAddCat();
    render();
  } catch (err) {
    console.error(err);
    setSync('error');
    showToast('Error al agregar', true);
  }
}

async function deleteCategory(section, catId) {
  const cat = state.categories[section].find(c => c.id === catId);
  if (!cat) return;
  if (!confirm(`¿Eliminar "${cat.name}"?\nSe borrarán también los montos cargados.`)) return;
  setSync('syncing');
  try {
    const { error } = await db.from('categories').delete().eq('id', catId);
    if (error) throw error;
    state.categories[section] = state.categories[section].filter(c => c.id !== catId);
    const affected = [];
    for (const mk in state.monthly) {
      if (state.monthly[mk].amounts[catId] !== undefined) {
        delete state.monthly[mk].amounts[catId];
        affected.push(mk);
      }
    }
    for (const mk of affected) await saveMonthData(mk);
    setSync('synced');
    render();
  } catch (err) {
    console.error(err);
    setSync('error');
    showToast('Error al eliminar', true);
  }
}

function openRename(section, catId) {
  state.pending.section = section;
  state.pending.catId = catId;
  const cat = state.categories[section].find(c => c.id === catId);
  document.getElementById('renameInput').value = cat.name;
  document.getElementById('renameModal').classList.add('show');
  setTimeout(() => { const i = document.getElementById('renameInput'); i.focus(); i.select(); }, 50);
}

function closeRename() { document.getElementById('renameModal').classList.remove('show'); }

async function confirmRename() {
  const name = document.getElementById('renameInput').value.trim();
  if (!name) return;
  setSync('syncing');
  try {
    const { error } = await db.from('categories').update({ name }).eq('id', state.pending.catId);
    if (error) throw error;
    const cat = state.categories[state.pending.section].find(c => c.id === state.pending.catId);
    if (cat) cat.name = name;
    setSync('synced');
    closeRename();
    render();
  } catch (err) {
    console.error(err);
    setSync('error');
    showToast('Error al renombrar', true);
  }
}

['addCatModal', 'renameModal'].forEach(id => {
  document.getElementById(id).addEventListener('click', (e) => {
    if (e.target.id === id) {
      if (id === 'addCatModal') closeAddCat();
      else closeRename();
    }
  });
});

// Iniciar todo
initialize();
</script>
</body>
